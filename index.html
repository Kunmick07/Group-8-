<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>final work</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <section id="contact" class="contact-section">
  
  <h2>Have Questions About Planetary Science?</h2>
  <p>Interested in learning more about space, astronomy, or how planetary data is collected and analyzed? <br>Reach out and we’ll get back to you.</p>
  
  <form class="contact-form">
    
    <div class="form-row">
      <div class="form-group">
        <label for="name">Full Name<span>*</span></label>
        <input type="text" id="name" name="name" placeholder="Full name" minlength="10" maxlength="20" required>
      </div>

      <div class="form-group">
        <label for="Email">Email<span>*</span></label>
        <input type="email" id="Email" name="email" placeholder="example@example.com" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="tel">Phone Number<span>*</span></label>
        <input type="tel" id="tel" name="tel" maxlength="11" placeholder="Please enter a valid phone number" required>
      </div>

      <div class="form-group">
        <label for="Message">Message<span>*</span></label>
        <textarea name="Message" id="Message" maxlength="100" placeholder="Enter your message" required></textarea>
        <small class="char-count">100 characters</small>
      </div>
    </div>

    <button type="submit" class="submit-btn">Submit <span>&gt;</span></button>
    
  </form>
</section>
</body>
</html>
